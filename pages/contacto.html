<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Contacto - Holozon</title>
  </head>
  <body>
    <header>
      <div class="div-logo">
        <a class="logo" href="../index.html"
          ><img src="../img/HolozonBoxTransparent.webp" alt="Holozon Logo"
        /></a>
      </div>
      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="./contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="contacto">
        <h1 class="title-contacto text-secondary">Contacta con nosotros</h1>
        <!-- modify this form HTML and place wherever you want your form -->
        <form
          class="form-contacto"
          action="https://formspree.io/f/xppqjeaj"
          method="POST"
        >
          <div class="grupo-input">
            <label>
              Email:
              <input type="email" name="email" />
            </label>
          </div>

          <div class="grupo-input">
            <label>
              Mensaje:
              <textarea name="message"></textarea>
            </label>
          </div>
          <!-- your other form fields go here -->
          <button class="btn bg-secondary text-secondary" type="submit">
            Enviar
          </button>
        </form>
      </section>
    </main>
    <footer>
      <p>Holozon hecho por Kevin</p>
      <nav>
        <ul class="footer-list">
          <li>
            <img src="../img/instagram-logo.png" alt="logo de instagram" />
          </li>
          <li><img src="../img/whatsapp-logo.png" alt="logo de whatsapp" /></li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
